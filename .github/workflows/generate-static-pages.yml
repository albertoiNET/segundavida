name: Generate SegundaVida static item pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-static-pages.yml"
      - "index.html"
      - "404.html"
      - "scripts/generate_static_pages.py"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Public JSON endpoint override (optional)"
        required: false
        type: string
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select public source
        id: source
        env:
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          REPOSITORY_SOURCE_URL: ${{ vars.SEGUNDAVIDA_PUBLIC_ITEMS_URL }}
        run: |
          source_url="$INPUT_SOURCE_URL"
          if [ -z "$source_url" ]; then source_url="$REPOSITORY_SOURCE_URL"; fi
          if [ -z "$source_url" ]; then source_url="https://tasks.nukeador.com/webhook/segundavida/data"; fi
          echo "url=$source_url" >> "$GITHUB_OUTPUT"

      - name: Generate pages
        if: steps.source.outputs.url != ''
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
        run: |
          mkdir -p generated-site
          cp -R assets css js favoritos ofrecer perfil generated-site/
          cp index.html generated-site/
          python3 scripts/generate_static_pages.py \
            --source-url "$SOURCE_URL" \
            --output-dir generated-site \
            --site-url "https://segundavida.aldeapucela.org"
          python3 scripts/sync_static_asset_urls.py \
            --site generated-site \
            --template generated-site/index.html \
            --version "sv-${GITHUB_SHA}"

      - name: Store generated site for shared asset deployments
        if: steps.source.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: segundavida-static-site
          path: generated-site/
          retention-days: 30

      - name: Explain skipped generation
        if: steps.source.outputs.url == ''
        run: |
          echo "No public source configured. Pass source_url or set the repository override variable."

      - name: Upload generated site for Pages
        if: steps.source.outputs.url != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: generated-site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.source.outputs.url != ''
        uses: actions/deploy-pages@v4
