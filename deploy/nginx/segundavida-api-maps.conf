# Included from the nginx http{} context.
map $args $segundavida_data_args_allowed {
    default 0;
    "" 1;
    ~^scope=(active|all)$ 1;
    "~^scope=all&owner_username=[A-Za-z][A-Za-z0-9_]{4,31}$" 1;
    "~^owner_username=[A-Za-z][A-Za-z0-9_]{4,31}&scope=all$" 1;
}

map $arg_scope $segundavida_scope_key {
    default $arg_scope;
    "" active;
}
