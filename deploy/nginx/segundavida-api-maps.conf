# Included from the nginx http{} context.
map $args $segundavida_data_args_allowed {
    default 0;
    "" 1;
    ~^scope=(active|all)$ 1;
    "~^scope=all&owner_username=[A-Za-z][A-Za-z0-9_]{4,31}$" 1;
    "~^owner_username=[A-Za-z][A-Za-z0-9_]{4,31}&scope=all$" 1;
}

map $arg_scope $segundavida_scope_key {
    default $arg_scope;
    "" active;
}

# Keep production and local development origins explicit; do not use '*'.
map $http_origin $segundavida_cors_origin {
    default "";
    "https://frontend.example.org" $http_origin;
    "~^https?://localhost(?::[0-9]{1,5})?$" $http_origin;
    "~^https?://127\\.0\\.0\\.1(?::[0-9]{1,5})?$" $http_origin;
}
