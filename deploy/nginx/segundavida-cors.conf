# Include inside the API locations that should be readable by the frontend.
# The upstream may emit its own CORS headers; hide them so Nginx emits one
# controlled allowlisted origin per request.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
add_header Access-Control-Allow-Origin $segundavida_cors_origin always;
add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Accept, Cache-Control, Content-Type, Authorization" always;
add_header Vary "Origin" always;

if ($request_method = OPTIONS) {
    return 204;
}
