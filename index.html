<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SegundaVida, una iniciativa de Aldea Pucela."
    />
    <title>SegundaVida · Aldea Pucela</title>
    <link rel="stylesheet" href="./css/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  </head>
  <body>
    <main class="site-shell">
      <header class="brand-lockup" aria-label="SegundaVida por Aldea Pucela">
        <span class="brand-mark" aria-hidden="true">♻️</span>
        <div>
          <p class="brand-name">SegundaVida</p>
          <p class="brand-owner">Aldea Pucela</p>
        </div>
      </header>

      <section class="status-page" aria-labelledby="page-title">
        <p class="eyebrow">HITO 3 · MINI APP MÍNIMA</p>
        <h1 id="page-title">Mini App en construcción</h1>
        <p class="intro">
          La base pública de SegundaVida ya está preparada para crecer dentro
          del ecosistema de Aldea Pucela.
        </p>

        <p class="environment-line" aria-live="polite">
          Entorno: <strong id="runtime-name">navegador</strong>
          <span id="telegram-sdk-state" hidden></span>
        </p>

        <div class="system-status" aria-label="Estado de los servicios">
          <div class="status-row">
            <span class="status-label">Web</span>
            <span class="status-value status-value--ok" id="web-status">
              <span class="status-dot" aria-hidden="true"></span>
              OK
            </span>
          </div>
          <div class="status-row">
            <span class="status-label">Telegram</span>
            <span class="status-value status-value--pending" id="telegram-status">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="telegram-status-label">Sin comprobar</span>
            </span>
          </div>
          <div class="status-row">
            <span class="status-label">n8n</span>
            <span class="status-value status-value--pending">
              <span class="status-dot" aria-hidden="true"></span>
              Sin comprobar
            </span>
          </div>
        </div>
      </section>

      <footer class="site-footer">Valladolid · Aldea Pucela</footer>
    </main>

    <script src="./js/telegram.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
